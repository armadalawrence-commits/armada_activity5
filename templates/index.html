
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 8px;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
        }
    </style>
</head>
<body>
    <h1>Student API Interface</h1>

    <h2>Student Information</h2>
    <button onclick="loadStudent()">Load Student Information</button>
    <div id="result"></div>

    <hr>

    <h2>Greeting API</h2>
    <input type="text" id="nameInput" placeholder="Enter your first name">
    <button onclick="sayHello()">Say Hello</button>
    <p id="greeting"></p>

    <script>
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').textContent =
                        'Unable to retrieve data.';
                });
        }

        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    document.getElementById('greeting').textContent =
                        data.message;
                })
                .catch(error => {
                    document.getElementById('greeting').textContent =
                        'Unable to retrieve greeting.';
                });
        }
    </script>
</body>
</html>
